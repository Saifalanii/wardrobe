<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="10" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- soft glow halo, echoing the loading screen's wordmark glow -->
  <ellipse cx="256" cy="256" rx="170" ry="196" fill="#F8FAFC" opacity="0.10" filter="url(#glow)"/>

  <!-- folding-garment mark, matching the loading screen's loader -->
  <g filter="url(#shadow)">
    <rect x="140" y="120" width="232" height="272" rx="32" fill="#F8FAFC" opacity="0.14"/>
    <rect x="140" y="120" width="113" height="272" rx="26" fill="#F8FAFC" opacity="0.92"/>
    <rect x="259" y="120" width="113" height="272" rx="26" fill="#F8FAFC" opacity="0.62"/>
  </g>
</svg>
